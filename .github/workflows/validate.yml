name: Validate candidate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scientific-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m pytest -q
        if: ${{ hashFiles('tests/*.py') != '' }}
      - run: python scripts/build_gallery.py --base-path /science-visualizations/science/
      - name: Check gallery index
        run: test -f dist/science/catalog.json

