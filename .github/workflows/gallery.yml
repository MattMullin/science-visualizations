name: Publish approved gallery
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'gallery/**'
      - 'scripts/build_gallery.py'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python scripts/build_gallery.py --base-path /science-visualizations/science/
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

