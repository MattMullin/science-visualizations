name: Gallery preview
on:
  pull_request:
    paths:
      - 'projects/**'
      - 'gallery/**'
      - 'scripts/build_gallery.py'
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python engines/dust/render.py --seconds 20 --fps 20
        if: ${{ hashFiles('projects/001-saharan-dust/manifest.json') != '' }}
      - run: python scripts/build_gallery.py --base-path /science-visualizations/science/
      - run: python scripts/build_candidate_preview.py 001-saharan-dust
        if: ${{ hashFiles('projects/001-saharan-dust/manifest.json') != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-preview
          path: output/candidate-preview
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('projects/001-saharan-dust/manifest.json') != '' }}
        with:
          name: saharan-dust-video-preview
          path: output/001-saharan-dust/saharan-dust.mp4
          retention-days: 7
